name: Deploy to Azure

on:
  push:
    branches:
      - azure

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate server-only package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const serverDeps = [
              'bcrypt', 'cloudinary', 'cors', 'dotenv', 'express',
              'express-rate-limit', 'firebase-admin', 'mongoose',
              'node-cron', 'resend', 'sharp', 'socket.io', 'socket.io-client'
            ];
            pkg.dependencies = Object.fromEntries(
              Object.entries(pkg.dependencies).filter(([k]) => serverDeps.includes(k))
            );
            delete pkg.devDependencies;
            pkg.scripts = { start: 'node server.js' };
            pkg.main = 'server.js';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Zip server artifact only
        run: |
          zip -qr release.zip server.js package.json services

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: letsbunk-server
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip
